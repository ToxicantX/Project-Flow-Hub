name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-flow-hub-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure deployment SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/project-flow-hub
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/project-flow-hub ~/.ssh/known_hosts

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          release_id="${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="/tmp/project-flow-hub-${release_id}.tar.gz"
          tar -C dist -czf "$archive" .
          scp -i ~/.ssh/project-flow-hub "$archive" "$DEPLOY_USER@$DEPLOY_HOST:$archive"
          ssh -i ~/.ssh/project-flow-hub "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s --' "$release_id" "$archive" < scripts/deploy-release.sh

      - name: Verify public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --show-error --silent --retry 4 --retry-delay 2 \
            https://draw.wsxcant.me/health.json
